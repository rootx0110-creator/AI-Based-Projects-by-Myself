{% extends "base.html" %}
{% block title %}Login — {{ ctf_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <div class="panel form-panel glow">
    <h2>Access Terminal</h2>
    {% if error %}<div class="form-error">✖ {{ error }}</div>{% endif %}
    <form method="post">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <div class="mt">
        <button class="btn primary" type="submit" style="width:100%">▸ Authenticate</button>
      </div>
    </form>
    <p class="muted mt">No account? <a href="{{ url_for('ctf.register') }}">Join the grid</a></p>
  </div>
</div>
{% endblock %}
