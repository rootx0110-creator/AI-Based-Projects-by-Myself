[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arpscan"
version = "0.1.0"
description = "ARP scanner / live-host discovery tool (cross-platform)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["arp", "network", "scanner", "discovery", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# scapy is optional: the "system" backend (ping sweep + OS ARP table)
# works with zero third-party dependencies.
scapy = ["scapy>=2.5"]
dev = ["pytest>=7"]

[project.scripts]
arpscan = "arpscan.cli:main"

[tool.setuptools.packages.find]
include = ["arpscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]