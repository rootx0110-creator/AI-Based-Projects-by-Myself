<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SOAR-Lite{% endblock %} · SOC Automation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233aa3ff'/><text x='50' y='72' font-size='62' font-family='Arial' font-weight='800' fill='%2304101c' text-anchor='middle'>S</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">S</div>
        <div>
          <div class="name">SOAR-Lite</div>
          <div class="sub">Playbook Runner</div>
        </div>
      </div>
      <nav>
        <div class="grp">Operations</div>
        <a class="nav-item {{ 'active' if active == 'dashboard' }}" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span class="lbl">Dashboard</span>
        </a>
        <a class="nav-item {{ 'active' if active == 'incidents' }}" href="/incidents">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
          <span class="lbl">Incidents</span>
          <span class="bump" id="nav-open-count" style="display:none">0</span>
        </a>
        <a class="nav-item {{ 'active' if active == 'playbooks' }}" href="/playbooks">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
          <span class="lbl">Playbooks</span>
        </a>
        <a class="nav-item {{ 'active' if active == 'executions' }}" href="/executions">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          <span class="lbl">Executions</span>
          <span class="bump" id="nav-run-count" style="display:none">0</span>
        </a>
        <div class="grp">Administration</div>
        <a class="nav-item {{ 'active' if active == 'settings' }}" href="/settings">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="lbl">Settings</span>
        </a>
      </nav>
      <div class="foot">
        <span data-health><span class="dot"></span>All systems nominal</span><br>
        <span class="l" style="color:#454f61">SOAR-Lite v1.0 · local SOC</span>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <h1>{% block page %}SOAR-Lite{% endblock %}</h1>
        <span class="crumb">{% block crumb %}{% endblock %}</span>
        <div class="spacer"></div>
        <button class="btn primary sm" onclick="window._openNewIncident && window._openNewIncident()" style="display:{% block newbtn %}{% endblock %}">＋ New Incident</button>
        <span class="utc-clock" id="utc-clock"></span>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <div id="toast-root"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
